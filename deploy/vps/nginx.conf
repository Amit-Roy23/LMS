# Nginx site for ADSIGN Skill Academy (installed by setup-server.sh; certbot adds the TLS lines).
limit_req_zone $binary_remote_addr zone=adsign_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=adsign_api:10m rate=20r/s;

server {
    listen 80;
    server_name academy.example.com;

    client_max_body_size 30m;
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/vnd.apple.mpegurl image/svg+xml;

    # Encrypted video segments: served straight from disk, cached; useless without the key
    location /media/hls/ {
        alias /srv/adsign/apps/web/public/media/hls/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        valid_referers server_names;
        if ($invalid_referer) { return 403; }
    }

    # Only free-preview MP4s exist; everything else streams as encrypted HLS
    location /media/ {
        alias /srv/adsign/apps/web/public/media/;
        expires 30d;
    }

    # Sign-in, OTP and enquiry endpoints: slow down brute force
    location ~ ^/api/v1/(auth|inquiries) {
        limit_req zone=adsign_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=adsign_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
